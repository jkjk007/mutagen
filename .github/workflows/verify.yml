# This workflow exists only in this fork. It builds and tests the changes on
# the fix branch and publishes nothing outside the repository: no releases, no
# pull requests, no messages to the upstream project.
name: Verify

on:
  push:
    branches:
      - fix/mutagen-fixes-coder
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build agent bundles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Build local bundles
        run: go run scripts/build.go --mode=local
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: mutagen-build
          path: build/
          retention-days: 7
          if-no-files-found: warn

  linux:
    name: Linux - format, vet, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        goversion: ["1.25.x", "1.26.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.goversion }}
      - name: gofmt
        run: |
          output="$(gofmt -s -l .)"
          if [ -n "$output" ]; then
            echo "The following files are not gofmt'd:"
            echo "$output"
            gofmt -s -d $output
            exit 1
          fi
      - name: go vet
        run: go vet -composites=false ./pkg/... ./cmd/... ./scripts/... ./tools/...
      - name: go build
        run: go build ./pkg/... ./cmd/...
      - name: Build agent bundles
        run: go run scripts/build.go --mode=local
      - name: Unit tests - filesystem
        run: go test -v ./pkg/filesystem/...
      - name: Unit tests - agent
        run: go test -v ./pkg/agent/...
      - name: Unit tests - synchronization endpoint
        run: go test -v ./pkg/synchronization/endpoint/local/

  cross:
    name: Cross-compile windows/darwin/linux
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Windows amd64
        run: GOOS=windows GOARCH=amd64 go build ./pkg/... ./cmd/...
      - name: Linux arm64
        run: GOOS=linux GOARCH=arm64 go build ./pkg/... ./cmd/...
      - name: Darwin arm64
        run: GOOS=darwin GOARCH=arm64 go build ./pkg/... ./cmd/...

  release:
    name: Release bundles (Windows, Linux, macOS)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Release notes are generated from the commit range since the
          # previous fork build, so the full history and tags are required.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Determine release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Base version comes from the highest published semver release, or from
          # version.go if nothing has been published yet. The patch component is
          # then bumped, so each published build is a normal version increment.
          LATEST=$(gh release list --limit 200 --exclude-drafts \
            | awk '{print $1}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -1 || true)
          if [ -n "$LATEST" ]; then
            BASE="${LATEST#v}"
          else
            MAJOR=$(sed -n 's/.*VersionMajor = \([0-9]*\).*/\1/p' pkg/mutagen/version.go | head -1)
            MINOR=$(sed -n 's/.*VersionMinor = \([0-9]*\).*/\1/p' pkg/mutagen/version.go | head -1)
            PATCH=$(sed -n 's/.*VersionPatch = \([0-9]*\).*/\1/p' pkg/mutagen/version.go | head -1)
            BASE="$MAJOR.$MINOR.$PATCH"
          fi
          MAJOR=$(echo "$BASE" | cut -d. -f1)
          MINOR=$(echo "$BASE" | cut -d. -f2)
          PATCH=$(echo "$BASE" | cut -d. -f3)
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "previous=$LATEST" >> "$GITHUB_OUTPUT"
          # Stamp the version into the source so the binaries report it.
          sed -i "s/^\tVersionMajor = [0-9]*/\tVersionMajor = $MAJOR/" pkg/mutagen/version.go
          sed -i "s/^\tVersionMinor = [0-9]*/\tVersionMinor = $MINOR/" pkg/mutagen/version.go
          sed -i "s/^\tVersionPatch = [0-9]*/\tVersionPatch = $((PATCH + 1))/" pkg/mutagen/version.go
          echo "base: ${BASE:-none} -> next: $NEXT"
          grep -E 'Version(Major|Minor|Patch) =' pkg/mutagen/version.go

      - name: Build release bundles
        run: go run scripts/build.go --mode=release-slim
      - name: List output
        run: ls -la build/release/ || true
      - name: Upload release bundles
        uses: actions/upload-artifact@v4
        with:
          name: mutagen-release
          path: build/release/*
          retention-days: 14
          if-no-files-found: error
      - name: Publish release in this repository only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          PREVIOUS="${{ steps.version.outputs.previous }}"
          {
            echo "Published in this repository only."
            echo
            echo "Built from commit \`${GITHUB_SHA}\`."
            echo
            if [ -n "$PREVIOUS" ]; then
              echo "## Changes since ${PREVIOUS}"
              echo
              git log --no-merges --format='- %s (`%h`)' "${PREVIOUS}..HEAD"
            else
              echo "## Changes since the upstream base"
              echo
              git log --no-merges --format='- %s (`%h`)' -20 HEAD
            fi
            echo
            echo "Each archive contains the CLI binary and the agent bundle for one platform."
          } > release-notes.md
          cat release-notes.md
          gh release create "$TAG" build/release/*.tar.gz \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --notes-file release-notes.md

  windows:
    name: Windows - build and read-only removal test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: go build
        run: go build ./pkg/... ./cmd/...
      - name: Read-only removal test
        run: go test -v -run "TestDirectoryRemoveFileReadOnly" ./pkg/filesystem/
      - name: Filesystem tests
        run: go test -v ./pkg/filesystem/
